<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerenciamento de Ondas — Black Friday</title>
<style>
:root{--bg:#f2f2f2;--ink:#111;--card:#fff;--line:#111;--acc:#111;--mut:#666}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}
.bar{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar b{margin-right:auto;font-size:15px}
.bar button,.bar select{background:#fff;color:#111;border:0;border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:13px}
.bar button.t{background:#444;color:#fff}
.bar button.on{background:#f5c400}
.page{background:var(--card);width:210mm;min-height:297mm;margin:16px auto;padding:10mm;box-shadow:0 2px 10px #0003}
.hd{display:grid;grid-template-columns:auto 1fr auto auto;gap:0;border:3px solid var(--line);margin-bottom:6px}
.hd div{padding:6px 10px;border-right:2px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.hd div:last-child{border-right:0}
.hd input{border:0;border-bottom:1px solid #999;font:inherit;font-size:20px;width:90px;background:transparent;text-align:center}
h1{margin:0 0 6px;background:#111;color:#fff;text-align:center;font-size:22px;letter-spacing:1px;padding:8px}
table{width:100%;border-collapse:collapse;margin-bottom:6px}
th{background:#111;color:#fff;font-size:12px;padding:5px;text-transform:uppercase}
td{border:2px solid var(--line);padding:3px 5px;vertical-align:middle}
td.nm{font-weight:800;font-size:15px;width:26mm;text-align:center;background:#eee}
td.nm small{display:block;font-weight:600;font-size:10px;color:var(--mut)}
td.nm.sub{background:#fff;font-size:12px}
.qb{border:1px solid #111;background:#f5c400;border-radius:4px;font-weight:800;font-size:11px;cursor:pointer;padding:3px 6px}
td.nm.v{background:#ddd}
.grp td.g{background:#111;color:#fff;font-weight:800;font-size:12px;padding:4px 8px}
.grp td.g span{font-weight:400;opacity:.85}
input.f,textarea.f{width:100%;border:0;background:transparent;font:inherit;font-size:14px;outline:none;resize:none}
input.n{text-align:center;font-weight:800;font-size:18px}
td.c{text-align:center;font-weight:800;font-size:15px;width:16mm}
td.p{width:24mm}
td.l{width:34mm}
tfoot td{background:#111;color:#fff;font-weight:800;text-align:center;font-size:15px}
.note{font-size:11px;color:var(--mut);margin:4px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
.cols .tm{border:3px solid var(--line)}
.cols .tm h2{margin:0;background:#111;color:#fff;font-size:16px;padding:6px 10px;display:flex;justify-content:space-between}
.cols .lid{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:2px solid var(--line);font-weight:800;font-size:13px}
.cols table{margin:0}
.cols td.nm{width:38%;font-size:14px;padding:9px 4px}
.cols td{padding:0 5px}
.cols td input{padding:10px 2px}
.tot{padding:6px 10px;background:#eee;font-weight:800;font-size:13px;text-align:right;border-top:2px solid var(--line)}
.pb{display:none}
@media print{
 @page{size:A4 portrait;margin:6mm}
 body{background:#fff}
 .bar,.noprint{display:none}
 .page{margin:0;box-shadow:none;width:auto;min-height:0;padding:0;page-break-after:always}
 .page:last-child{page-break-after:auto}
 .pb{display:inline}
 input,textarea{color:#000}
}
</style>
</head>
<body>
<div class="bar">
 <b>Gerenciamento de Ondas · Black Friday</b>
 <button class="t on" id="t1" onclick="setTurno(1)">1º Turno</button>
 <button class="t" id="t2" onclick="setTurno(2)">2º Turno</button>
 <button onclick="novaOnda()">Nova onda (zera peças)</button>
 <button onclick="limpar()">Limpar turno</button>
 <button onclick="window.print()">Imprimir</button>
</div>

<!-- FOLHA 1: SINGLE -->
<section class="page" id="p1">
 <div class="hd">
  <div>ONDA <input data-k="onda" style="width:120px;font-size:18px"></div>
  <div>DATA <input data-k="data" style="width:120px;font-size:16px"></div>
  <div>TURNO <span id="lbTurno1">1</span></div>
  <div>HORA <input data-k="hora" style="width:70px;font-size:16px"></div>
 </div>
 <h1>SINGLE · DIVISÃO DA ONDA POR RUA</h1>
 <table id="tSingle"></table>
 <p class="note">Marque OK quando terminar (risca a linha). Acima de 180 peças a rua deve ser quebrada: use +Q para criar a quebra (outra separação da mesma onda).</p>
</section>

<!-- FOLHA 2: COLMEIA -->
<section class="page" id="p2">
 <div class="hd">
  <div>DATA <input data-k="data2" style="width:120px;font-size:16px"></div>
  <div></div>
  <div>TURNO <span id="lbTurno2">1</span></div>
  <div></div>
 </div>
 <h1>COLMEIA · COLABORADORES</h1>
 <div class="cols" id="cols"></div>
</section>

<script>
var SINGLE=[
 {g:'PISO 1 — Líder: ',k:'lid1',rows:['A01','B01','C01','E01','F01','G01']},
 {g:'PISO 2 — Líder: ',k:'lid2',rows:['A02','B02','C02']},
 {g:'PISO 3 — Líder: ',k:'lid3',rows:['A03','B03','C03']},
 {g:'PISO 4 — Líder: ',k:'lid4',rows:['A04','B04','C04']}
];
var T1=['BLACK','BRANCA','AMARELA','AZUL','VERDE','VERMELHA','LARANJA','LILÁS','ROSA','ROXA'];
var T2=['CIANO','CINZA','MOSTARDA','MARROM','ESMERALDA','ESCARLATE','TIJOLO','TERRACOTA','ORQUIDEA','OLIVA'];
var LIM=180,turno=1,S={};
function ids(r){var n=1+(parseInt(S['q_'+r])||0),a=[r];for(var i=2;i<=n;i++)a.push(r+'_'+i);return a}
function addQ(r){S['q_'+r]=(parseInt(S['q_'+r])||0)+1;save();build();fill()}
function delQ(r){var n=parseInt(S['q_'+r])||0;if(!n)return;var id=r+'_'+(n+1);['p_','c_','d_'].forEach(function(k){delete S[k+id]});S['q_'+r]=n-1;save();build();fill()}
function $(s){return document.querySelector(s)}
function key(){return 'ondas_black_t'+turno}
function load(){try{S=JSON.parse(localStorage.getItem(key())||'{}')}catch(e){S={}}}
function save(){try{localStorage.setItem(key(),JSON.stringify(S))}catch(e){}}

function build(){
 var h='<thead><tr><th>Rua</th><th>Peças</th><th>Colaborador(es)</th><th>OK</th></tr></thead>';
 SINGLE.forEach(function(g,gi){
  h+='<tbody class="grp"><tr><td class="g" colspan="4">'+g.g+'<input class="f" style="display:inline;width:55mm;background:#fff;color:#111;padding:2px 6px;border-radius:3px" data-k="'+g.k+'" placeholder="nome do líder">'+(gi==0?' <span>· também gerencia os 2 times de vestuário</span>':'')+'<span style="float:right" id="pg'+gi+'"></span></td></tr>';
  g.rows.forEach(function(r){
   ids(r).forEach(function(id,i){
    var vest=/^[EFG]01$/.test(r),tag=vest?'<small style="color:#c00">VESTUÁRIO</small>':'';
    var lab=i?r+'<small>Quebra '+(i+1)+'</small>':r+tag+'<small id="al_'+r+'"></small>';
    var btn=i==0?'<button class="qb noprint" onclick="addQ(\''+r+'\')" title="Adicionar quebra">+Q</button>'
      :(i==ids(r).length-1?'<button class="qb noprint" onclick="delQ(\''+r+'\')" title="Remover quebra">✕</button>':'');
    h+='<tr id="row_'+id+'"><td class="nm'+(i?' sub':'')+'">'+lab+'</td>'
     +'<td class="p"><input class="f n" inputmode="numeric" data-k="p_'+id+'"></td>'
     +'<td><input class="f" style="font-size:16px;padding:8px 2px" data-k="c_'+id+'"></td>'
     +'<td class="c"><input type="checkbox" style="width:22px;height:22px" data-k="d_'+id+'"> '+btn+'</td></tr>';
   });
  });
  h+='</tbody>';
 });
 h+='<tfoot><tr><td>TOTAL</td><td id="totP">0</td><td id="totD" colspan="2"></td></tr></tfoot>';
 $('#tSingle').innerHTML=h;

 function col(n,arr,k){
  var r=arr.map(function(c,i){return '<tr><td class="nm">'+c+'</td><td><input class="f" data-k="'+k+i+'" data-calc="1"></td></tr>'}).join('');
  return '<div class="tm"><h2><span>'+n+'</span><span id="ct_'+k+'">0/10</span></h2><div class="lid">Líder: <input class="f" data-k="lid_'+k+'"></div><table>'+r+'</table></div>';
 }
 $('#cols').innerHTML=col('TIME 1',T1,'a')+col('TIME 2',T2,'b');
}
function fill(){
 document.querySelectorAll('[data-k]').forEach(function(e){if(e.type==='checkbox')e.checked=S[e.dataset.k]==='1';else e.value=S[e.dataset.k]||''});
 $('#lbTurno1').textContent=$('#lbTurno2').textContent=turno;
 $('#t1').className='t'+(turno==1?' on':'');$('#t2').className='t'+(turno==2?' on':'');
 calc();
}
function nlines(v){return (v||'').split('\n').filter(function(x){return x.trim()}).length}
function calc(){
 var tp=0,td=0;
 SINGLE.forEach(function(g,gi){
  var gp=0,gd=0;
  g.rows.forEach(function(r){
   var rt=0,L=ids(r);
   L.forEach(function(id){
    var p=parseInt(S['p_'+id])||0,d=S['d_'+id]==='1';
    rt+=p;gp+=p;if(d)gd+=p;
    var row=$('#row_'+id);
    row.style.opacity=d?'.45':'1';
    row.querySelectorAll('input:not([type=checkbox])').forEach(function(i){i.style.textDecoration=d?'line-through':'none'});
    var pi=row.querySelector('[data-k^=p_]');pi.style.color=p>LIM?'#c00':'';
   });
   var need=Math.ceil(rt/LIM),al=$('#al_'+r);
   al.textContent=need>L.length?'⚠ quebrar em '+need:(L.length>1?L.length+' quebras':'');
   al.style.color=need>L.length?'#c00':'';
  });
  tp+=gp;td+=gd;
  $('#pg'+gi).textContent=gp+' peças · pendente '+(gp-gd);
 });
 $('#totP').textContent=tp;
 $('#totD').textContent='feito '+td+' · pendente '+(tp-td)+(tp?' ('+Math.round(td/tp*100)+'%)':'');
 ['a','b'].forEach(function(k){
  var n=0;for(var i=0;i<10;i++)if((S[k+i]||'').trim())n++;
  $('#ct_'+k).textContent=n+'/10';
 });
}
document.addEventListener('input',function(e){
 var k=e.target.dataset&&e.target.dataset.k;if(!k)return;
 S[k]=e.target.type==='checkbox'?(e.target.checked?'1':''):e.target.value;save();calc();
});
function setTurno(n){turno=n;load();fill()}
function novaOnda(){
 if(!confirm('Zerar peças, colaboradores e OK das ruas? Líderes e colmeias ficam.'))return;
 Object.keys(S).forEach(function(k){if(/^p_|^c_|^d_|^q_|^onda$|^hora$/.test(k))delete S[k]});
 save();fill();
}
function limpar(){
 if(!confirm('Limpar TUDO do '+turno+'º turno?'))return;
 S={};save();fill();
}
build();load();fill();
</script>
</body>
</html>
