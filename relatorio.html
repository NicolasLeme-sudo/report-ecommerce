<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report E-commerce — Outbound</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --navy-deep:#132043; --navy-mid:#1F3363; --navy-soft:#3A4F82;
    --olive:#6B7F3A; --olive-soft:#E4E9D6;
    --amber:#C98F1D; --amber-soft:#F7ECD4;
    --red:#B23A2E; --red-soft:#F5DEDA;
    --bg:#F3F4F7; --card:#FFFFFF; --border:#E1E4EA;
    --text:#1C2333; --text-muted:#6B7280;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:1440px;margin:0 auto;padding:20px 24px 48px;}

  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--navy-deep);color:#fff;padding:16px 24px;border-radius:10px;margin-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand .mark{
    width:38px;height:38px;border-radius:8px;
    background:linear-gradient(135deg,var(--olive),#8FA355);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--navy-deep);
  }
  .brand h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.2px;}
  .brand .sub{font-size:11.5px;color:#B9C2DA;letter-spacing:.4px;text-transform:uppercase;margin-top:2px;}
  .topmeta{font-size:12px;color:#B9C2DA;text-align:right;}
  .btn-nav{
    padding:8px 16px;border-radius:7px;border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.08);color:#fff;font-size:12.5px;font-weight:600;
    text-decoration:none;
  }
  .btn-nav:hover{background:rgba(255,255,255,.16);}
  .header-right{display:flex;align-items:center;gap:14px;}

  .section-title{
    font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:var(--navy-mid);margin:0 0 12px 2px;
  }

  .kpi-row{display:grid;grid-template-columns:repeat(3,1fr) 2.1fr;gap:14px;margin-bottom:16px;}
  .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 15px 12px;position:relative;overflow:hidden;}
  .kpi-card .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--text-muted);font-weight:600;}
  .kpi-card .value{font-size:23px;font-weight:700;margin-top:6px;color:var(--navy-deep);}
  .kpi-card .delta{font-size:11.5px;margin-top:5px;font-weight:600;}
  .delta.up{color:var(--olive);} .delta.down{color:var(--red);} .delta.flat{color:var(--text-muted);}
  .kpi-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .bar.ok{background:var(--olive);} .bar.warn{background:var(--amber);} .bar.bad{background:var(--red);}
  .kpi-card.spark{display:flex;flex-direction:column;justify-content:space-between;}
  .kpi-card.spark svg{margin-top:2px;}
  .spark-label{font-size:10px;font-weight:700;fill:#132043;font-variant-numeric:tabular-nums;}
  .spark-date{font-size:9.5px;fill:#9098AC;}
  .line-label{font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;}

  .leadtime-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
  .leadtime-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px 13px;position:relative;overflow:hidden;}
  .leadtime-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .leadtime-card .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--text-muted);font-weight:600;}
  .leadtime-card .media{font-size:23px;font-weight:700;margin-top:6px;color:var(--navy-deep);}
  .minmax-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .minmax-item .lab{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);font-weight:700;}
  .minmax-item .val{font-size:14px;font-weight:700;margin-top:2px;}
  .minmax-item.max .val{color:var(--red);} .minmax-item.min .val{color:var(--olive);}
  .minmax-item .pedido{font-size:10.5px;color:var(--text-muted);margin-top:1px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .stack{display:flex;flex-direction:column;gap:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;}

  table.matrix{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
  table.matrix th,table.matrix td{padding:8px 10px;text-align:center;}
  table.matrix thead th{background:var(--navy-deep);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.3px;}
  table.matrix thead th:first-child{text-align:left;border-radius:6px 0 0 0;}
  table.matrix thead th:last-child{border-radius:0 6px 0 0;}
  table.matrix tbody th{text-align:left;font-weight:600;color:var(--navy-mid);background:#F8F9FB;}
  table.matrix tbody td{border-bottom:1px solid var(--border);font-weight:600;}
  table.matrix tbody tr:last-child td, table.matrix tbody tr:last-child th{border-top:2px solid var(--navy-deep);background:#EEF1F8;font-weight:700;}
  .cell-heat-0{color:#B6BBC6;} .cell-heat-lo{color:var(--text);} .cell-heat-hi{color:var(--red);}

  .donut-wrap{display:flex;align-items:center;gap:20px;margin-top:8px;}
  svg.donut{flex-shrink:0;}
  .legend-aging{display:flex;flex-direction:column;gap:8px;font-size:13px;}
  .legend-aging .row{display:flex;align-items:center;gap:8px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .legend-aging b{margin-left:auto;font-variant-numeric:tabular-nums;}

  .placeholder-card{
    background:#F8F9FB;border:1px dashed var(--border);border-radius:10px;
    padding:24px 20px;text-align:center;color:var(--text-muted);font-size:12.5px;
  }

  .mkt-bars, .seg-bars{display:flex;flex-direction:column;gap:9px;margin-top:10px;}
  .mkt-row{display:grid;grid-template-columns:130px 1fr 60px;align-items:center;gap:10px;font-size:12.5px;}
  .seg-row{display:grid;grid-template-columns:110px 1fr 46px;align-items:center;gap:10px;font-size:12.5px;}
  .mkt-track, .seg-track{background:#EEF0F4;border-radius:5px;height:11px;overflow:hidden;}
  .mkt-fill, .seg-fill{height:100%;border-radius:5px;background:var(--navy-soft);}

  .week-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px;}
  .week-totais{display:flex;gap:16px;}
  .week-totais .item{text-align:right;}
  .week-totais .item .lab{font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--text-muted);}
  .week-totais .item .val{font-size:15px;font-weight:700;color:var(--navy-deep);}
  .legend-line{display:flex;gap:16px;font-size:11.5px;color:var(--text-muted);margin-top:6px;}
  .legend-line span{display:flex;align-items:center;gap:6px;}
  .legend-line i{width:14px;height:3px;border-radius:2px;display:inline-block;}

  .loading, .erro-carregamento{padding:40px;text-align:center;color:var(--text-muted);font-size:14px;}
  .erro-carregamento{color:var(--red);}
</style>
</head>

<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <div class="mark">CD</div>
      <div>
        <h1>Report E-commerce · Outbound</h1>
        <div class="sub">Dados reais — Supabase</div>
      </div>

    <div class="header-right">
      <a href="index.html" class="btn-nav">← Atualizar Dados</a>
      <div class="topmeta" id="ultimaAtualizacao">Carregando...</div>
    </div>
  </header>

  <div id="conteudo">
    <div class="loading">Carregando dados do Supabase...</div>

</div>

<script>
const SUPABASE_URL = "https://tawliuofpmfohylqdnix.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable__a5cJ6yFJIMgf505C4v7vQ_igDbuv5k";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Suaviza uma sequência de pontos [x,y] em curva (Catmull-Rom -> Bézier cúbica)
function pathSuave(pts) {
  if (!pts || pts.length < 2) return '';
  if (pts.length === 2) {
    return 'M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1)+' L'+pts[1][0].toFixed(1)+','+pts[1][1].toFixed(1);
  }
  let d = 'M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);
  }
  return d;
}

// Rótulo de dado com fundo (chip), para ficar legível mesmo sobre linhas/outros rótulos
function labelComFundo(svg, x, y, texto, opts) {
  opts = opts || {};
  const fs = opts.fontSize || 10, anchor = opts.anchor || 'middle';
  const corTexto = opts.cor || '#1C2333';
  const corFundo = opts.fundo || 'color-mix(in srgb, ' + corTexto + ' 30%, var(--card) 70%)';
  const peso = opts.peso || '700';
  const txt = String(texto);
  const largura = txt.length * fs * 0.62 + 8, altura = fs + 6;
  const rx = anchor === 'middle' ? x - largura/2 : (anchor === 'end' ? x - largura : x);
  const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x', rx.toFixed(1)); rect.setAttribute('y', (y - fs - 1).toFixed(1));
  rect.setAttribute('width', largura.toFixed(1)); rect.setAttribute('height', altura.toFixed(1));
  rect.setAttribute('rx', '4'); rect.setAttribute('fill', corFundo);
  svg.appendChild(rect);
  const t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('text-anchor', anchor);
  t.setAttribute('font-size', fs); t.setAttribute('font-weight', peso); t.setAttribute('fill', corTexto);
  t.textContent = txt; svg.appendChild(t);
  return t;
}

async function carregarRelatorio() {
  const { data, error } = await supabaseClient
    .from("dashboard_snapshots")
    .select("*")
    .eq("pagina", "outbound")
    .order("gerado_em", { ascending: false })
    .limit(2);

  if (error) {
    document.getElementById("conteudo").innerHTML =
      `<div class="erro-carregamento">Erro ao carregar dados: ${error.message}</div>`;
    return;
  }

  if (!data || data.length === 0) {
    document.getElementById("conteudo").innerHTML =
      `<div class="erro-carregamento">Nenhum dado encontrado ainda. Rode a atualização em "Abastecimento de Dados" primeiro.</div>`;
    return;
  }

  const atual = data[0].payload;
  const anterior = data[1] ? data[1].payload : null;

  const dataGerado = new Date(data[0].gerado_em);
  document.getElementById("ultimaAtualizacao").textContent =
    "Última atualização: " + dataGerado.toLocaleString('pt-BR');

  renderizar(atual, anterior);
}

function renderizar(atual, anterior) {
  const html = `
    <div class="section-title">Indicadores do dia</div>
    <div class="kpi-row" id="kpiRow"></div>

    <div class="leadtime-row" id="leadtimeRow"></div>

    <div class="grid2">
      <div class="stack">
        <div class="card">
          <div class="section-title">Status por etapa (Itens)</div>
          <table class="matrix" id="matrixItens"></table>
        </div>
        <div class="card">
          <div class="section-title">Status por etapa (Pedidos)</div>
          <table class="matrix" id="matrixPedidos"></table>
        </div>
      </div>
      <div class="stack">
        <div class="card">
          <div class="section-title">Itens por Marketplace (top 5)</div>
          <div class="mkt-bars" id="mktBars"></div>
        </div>
        <div class="card">
          <div class="section-title">Backlog FIFO em itens</div>
          <div class="donut-wrap">
            <svg class="donut" width="200" height="200" viewBox="0 0 220 220" id="donutSvg"></svg>
            <div class="legend-aging" id="donutLegend"></div>
          </div>
        </div>
        <div class="card">
          <div class="section-title">Itens por Segmento</div>
          <div class="seg-bars" id="segBars"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="week-head">
        <div class="section-title" style="margin-bottom:0;">Expedição × Forecast — últimos 7 dias</div>
        <div class="week-totais">
          <div class="item"><div class="lab">Expedido</div><div class="val" id="totalExpedido"></div></div>
          <div class="item"><div class="lab">Forecast</div><div class="val" id="totalForecast"></div></div>
        </div>
      </div>
      <svg id="weekSvg" width="100%" viewBox="0 0 1200 180" style="aspect-ratio:1200/180;height:auto"></svg>
      <div class="legend-line">
        <span><i style="background:var(--olive)"></i>Expedido</span>
        <span><i style="background:var(--navy-soft)"></i>Forecast</span>
      </div>
    </div>
  `;
  document.getElementById("conteudo").innerHTML = html;

  renderKpis(atual, anterior);
  renderLeadtimes(atual);
  renderMatriz(atual.status_por_etapa_itens, "matrixItens");
  renderMatriz(atual.status_por_etapa_pedidos, "matrixPedidos");
  renderBacklog(atual.backlog_fifo);
  renderMarketplaces(atual.marketplaces);
  renderSegmentos(atual.segmentos);
  renderExpedicaoSemana(atual.expedicao_semana);
}

function renderKpis(atual, anterior) {
  const otifAtual = atual.kpis.otif_pct;
  const otifAnterior = anterior ? anterior.kpis.otif_pct : null;
  let deltaTexto = "—", deltaClasse = "flat";
  if (otifAtual !== null && otifAnterior !== null) {
    const delta = otifAtual - otifAnterior;
    deltaTexto = (delta >= 0 ? "+" : "") + delta.toFixed(1).replace('.', ',') + " p.p.";
    deltaClasse = delta > 0 ? "up" : delta < 0 ? "down" : "flat";
  }

  const kpis = [
    { tag: "Pedidos em fluxo", valor: atual.kpis.pedidos_em_fluxo.toLocaleString('pt-BR'), delta: "—", status: "flat" },
    { tag: "Itens em fluxo", valor: atual.kpis.itens_em_fluxo.toLocaleString('pt-BR'), delta: "—", status: "flat" },
    { tag: "OTIF", valor: otifAtual !== null ? otifAtual.toFixed(1).replace('.', ',') + "%" : "—", delta: deltaTexto, status: deltaClasse === "up" ? "ok" : deltaClasse === "down" ? "bad" : "flat" },
  ];

  const kpiRow = document.getElementById("kpiRow");
  kpis.forEach(k => {
    const div = document.createElement("div");
    div.className = "kpi-card";
    div.innerHTML = `
      <div class="bar ${k.status}"></div>
      <div class="tag">${k.tag}</div>
      <div class="value">${k.valor}</div>
      <div class="delta ${k.status === 'ok' ? 'up' : k.status === 'bad' ? 'down' : 'flat'}">${k.delta}</div>`;
    kpiRow.appendChild(div);
  });

  renderSparklineIntegracao(atual.integracao_7dias);
}

function renderSparklineIntegracao(dados) {
  const kpiRow = document.getElementById("kpiRow");
  const card = document.createElement("div");
  card.className = "kpi-card spark";

  if (!dados || dados.pedidos_integrados.every(v => v === 0)) {
    card.innerHTML = `<div class="tag">Integração de Pedidos no WMS — por dia</div><div class="value" style="font-size:14px;color:var(--text-muted);">Sem dados ainda</div>`;
    kpiRow.appendChild(card);
    return;
  }

  card.innerHTML = `
    <div class="tag">Integração de Pedidos no WMS (últimos 7 dias)</div>
    <svg width="100%" height="86" viewBox="0 0 380 86" id="sparkSvg"></svg>`;
  kpiRow.appendChild(card);

  const svg = card.querySelector("#sparkSvg");
  const w = 380, h = 86, padL = 8, padR = 8, padTop = 18, padBottom = 16;
  const plotTop = padTop, plotBottom = h - padBottom;
  const max = Math.max(...dados.pedidos_integrados, 1);
  const min = Math.min(...dados.pedidos_integrados);
  const range = (max - min) || 1;
  const pts = dados.pedidos_integrados.map((v, i) => {
    const x = padL + i * ((w - padL - padR) / (dados.pedidos_integrados.length - 1));
    const y = plotBottom - ((v - min) / range) * (plotBottom - plotTop);
    return [x, y];
  });
  const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
  line.setAttribute("d", pathSuave(pts));
  line.setAttribute("fill", "none");
  line.setAttribute("stroke", "#3A4F82");
  line.setAttribute("stroke-width", "2.5");
  line.setAttribute("stroke-linecap", "round");
  line.setAttribute("stroke-linejoin", "round");
  svg.appendChild(line);

  pts.forEach((p, i) => {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", p[0]); c.setAttribute("cy", p[1]); c.setAttribute("r", i === pts.length - 1 ? 3.5 : 2.5);
    c.setAttribute("fill", i === pts.length - 1 ? "#132043" : "#3A4F82");
    svg.appendChild(c);

    labelComFundo(svg, p[0], p[1] - 7, dados.pedidos_integrados[i].toLocaleString('pt-BR'), {fontSize:10, cor:'#132043'});

    const dat = document.createElementNS("http://www.w3.org/2000/svg", "text");
    dat.setAttribute("x", p[0]); dat.setAttribute("y", h - 3);
    dat.setAttribute("text-anchor", "middle");
    dat.setAttribute("class", "spark-date");
    dat.textContent = dados.dias[i];
    svg.appendChild(dat);
  });
}

function cardLeadtime(tag, lt) {
  if (!lt) {
    return `<div class="leadtime-card"><div class="tag">${tag}</div><div class="media">Sem dados</div></div>`;
  }
  return `
    <div class="leadtime-card">
      <div class="bar ok"></div>
      <div class="tag">${tag}</div>
      <div class="media">${lt.media.toFixed(1).replace('.', ',')}h</div>
      <div class="minmax-row">
        <div class="minmax-item max">
          <div class="lab">Máx.</div>
          <div class="val">${lt.max.valor.toFixed(1).replace('.', ',')}h</div>
          <div class="pedido">Ped. ${lt.max.pedido}</div>
        </div>
        <div class="minmax-item min">
          <div class="lab">Mín.</div>
          <div class="val">${lt.min.valor.toFixed(1).replace('.', ',')}h</div>
          <div class="pedido">Ped. ${lt.min.pedido}</div>
        </div>
      </div>
    </div>`;
}

// Leadtime CD: valor principal em DIAS, com as horas equivalentes ao lado
function cardLeadtimeCD(tag, lt) {
  if (!lt) {
    return `<div class="leadtime-card"><div class="tag">${tag}</div><div class="media">Sem dados</div></div>`;
  }
  function formatoDiasHoras(horas) {
    const dias = (horas / 24).toFixed(1).replace('.', ',');
    const horasFmt = horas.toFixed(1).replace('.', ',');
    return `${dias}d <small style="font-size:13px;font-weight:600;color:var(--text-muted);">(${horasFmt}h)</small>`;
  }
  return `
    <div class="leadtime-card">
      <div class="bar ok"></div>
      <div class="tag">${tag}</div>
      <div class="media">${formatoDiasHoras(lt.media)}</div>
      <div class="minmax-row">
        <div class="minmax-item max">
          <div class="lab">Máx.</div>
          <div class="val">${formatoDiasHoras(lt.max.valor)}</div>
          <div class="pedido">Ped. ${lt.max.pedido}</div>
        </div>
        <div class="minmax-item min">
          <div class="lab">Mín.</div>
          <div class="val">${formatoDiasHoras(lt.min.valor)}</div>
          <div class="pedido">Ped. ${lt.min.pedido}</div>
        </div>
      </div>
    </div>`;
}

function renderLeadtimes(atual) {
  const leadtimeRow = document.getElementById("leadtimeRow");
  leadtimeRow.innerHTML =
    cardLeadtime("Leadtime SAP → WMS", atual.leadtimes.sap_wms) +
    cardLeadtime("Leadtime NF (integração)", atual.leadtimes.nf) +
    cardLeadtimeCD("Leadtime CD", atual.leadtimes.cd);
}

function renderMatriz(tabela, elId) {
  const el = document.getElementById(elId);
  if (!tabela || tabela.length === 0) {
    el.innerHTML = "<tr><td>Sem dados</td></tr>";
    return;
  }
  const marcas = tabela[0].marcas;
  let html = "<thead><tr><th>Status</th>";
  marcas.forEach(m => html += `<th>${m}</th>`);
  html += "<th>Total</th></tr></thead><tbody>";
  const totalPorMarca = marcas.map((_, i) => tabela.reduce((acc, e) => acc + e.valores[i], 0));
  const totalGeral = tabela.reduce((acc, e) => acc + e.total, 0);
  tabela.forEach(e => {
    html += `<tr><th>${e.status}</th>`;
    e.valores.forEach(v => {
      const cls = v === 0 ? "cell-heat-0" : (v > 3000 ? "cell-heat-hi" : "cell-heat-lo");
      html += `<td class="${cls}">${v.toLocaleString('pt-BR')}</td>`;
    });
    html += `<td style="font-weight:700;">${e.total.toLocaleString('pt-BR')}</td>`;
    html += "</tr>";
  });
  html += `<tr><th>Total</th>`;
  totalPorMarca.forEach(t => html += `<td>${t.toLocaleString('pt-BR')}</td>`);
  html += `<td>${totalGeral.toLocaleString('pt-BR')}</td>`;
  html += "</tr></tbody>";
  el.innerHTML = html;
}

function renderBacklog(backlog) {
  const donutSvg = document.getElementById("donutSvg");
  const donutLegend = document.getElementById("donutLegend");
  const cores = { "01": "var(--olive)", "02": "var(--amber)", "03": "#B6BBC6", "04+": "var(--red)" };
  const total = backlog.reduce((a, b) => a + b.valor, 0) || 1;

  let angleStart = -90;
  const cx = 110, cy = 110, r = 78, sw = 28;
  backlog.forEach(seg => {
    const angle = (seg.valor / total) * 360;
    const large = angle > 180 ? 1 : 0;
    const x1 = cx + r * Math.cos(angleStart * Math.PI / 180);
    const y1 = cy + r * Math.sin(angleStart * Math.PI / 180);
    const angleEnd = angleStart + angle;
    const x2 = cx + r * Math.cos(angleEnd * Math.PI / 180);
    const y2 = cy + r * Math.sin(angleEnd * Math.PI / 180);
    if (seg.valor > 0) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", cores[seg.label] || "#999");
      path.setAttribute("stroke-width", sw);
      donutSvg.appendChild(path);
    }
    angleStart = angleEnd;
  });

  const centerVal = document.createElementNS("http://www.w3.org/2000/svg", "text");
  centerVal.setAttribute("x", cx); centerVal.setAttribute("y", cy - 2);
  centerVal.setAttribute("text-anchor", "middle");
  centerVal.setAttribute("font-size", "22"); centerVal.setAttribute("font-weight", "700");
  centerVal.setAttribute("fill", "#1C2333");
  centerVal.textContent = total.toLocaleString('pt-BR');
  donutSvg.appendChild(centerVal);

  const centerLab = document.createElementNS("http://www.w3.org/2000/svg", "text");
  centerLab.setAttribute("x", cx); centerLab.setAttribute("y", cy + 16);
  centerLab.setAttribute("text-anchor", "middle");
  centerLab.setAttribute("font-size", "11"); centerLab.setAttribute("fill", "#6B7280");
  centerLab.textContent = "itens em backlog";
  donutSvg.appendChild(centerLab);

  backlog.forEach(seg => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="dot" style="background:${cores[seg.label] || '#999'}"></span>Dia ${seg.label}<b>${seg.valor.toLocaleString('pt-BR')}</b>`;
    donutLegend.appendChild(row);
  });
}

function renderMarketplaces(marketplaces) {
  const el = document.getElementById("mktBars");
  if (!marketplaces || marketplaces.length === 0) {
    el.innerHTML = "<div class='placeholder-card'>Sem dados de marketplace ainda</div>";
    return;
  }
  const max = Math.max(...marketplaces.map(m => m.valor)) || 1;
  el.innerHTML = "";
  marketplaces
    .slice().sort((a, b) => b.valor - a.valor)
    .slice(0, 5)
    .forEach(m => {
      const pct = (m.valor / max) * 100;
      const row = document.createElement("div");
      row.className = "mkt-row";
      row.innerHTML = `
        <div>${m.nome}</div>
        <div class="mkt-track"><div class="mkt-fill" style="width:${pct}%"></div></div>
        <div style="text-align:right;font-weight:700;">${m.valor.toLocaleString('pt-BR')}</div>`;
      el.appendChild(row);
    });
}

function renderSegmentos(segmentos) {
  const el = document.getElementById("segBars");
  if (!segmentos || segmentos.length === 0) {
    el.innerHTML = "<div class='placeholder-card'>Sem dados de segmento ainda</div>";
    return;
  }
  el.innerHTML = "";
  segmentos
    .slice().sort((a, b) => b.pct - a.pct)
    .forEach(s => {
      const row = document.createElement("div");
      row.className = "seg-row";
      row.innerHTML = `
        <div>${s.nome}</div>
        <div class="seg-track"><div class="seg-fill" style="width:${s.pct}%"></div></div>
        <div style="text-align:right;font-weight:700;">${s.pct.toFixed(1).replace('.', ',')}%</div>`;
      el.appendChild(row);
    });
}

function renderExpedicaoSemana(dados) {
  if (!dados) return;
  const totalExp = dados.expedido.reduce((a, b) => a + b, 0);
  const totalFc = dados.forecast.reduce((a, b) => a + b, 0);
  document.getElementById("totalExpedido").textContent = totalExp.toLocaleString('pt-BR');
  document.getElementById("totalForecast").textContent = totalFc.toLocaleString('pt-BR');

  const svg = document.getElementById("weekSvg");
  const w = 1100, h = 190, padL = 40, padR = 20, padT = 34, padB = 34;
  const allVals = [...dados.expedido, ...dados.forecast];
  const max = Math.max(...allVals, 1) * 1.15;
  const n = dados.dias.length;
  const xFor = i => padL + i * ((w - padL - padR) / (n - 1));
  const yFor = v => (h - padB) - (v / max) * (h - padT - padB);

  const axis = document.createElementNS("http://www.w3.org/2000/svg", "line");
  axis.setAttribute("x1", padL); axis.setAttribute("x2", w - padR);
  axis.setAttribute("y1", h - padB); axis.setAttribute("y2", h - padB);
  axis.setAttribute("stroke", "#E1E4EA"); axis.setAttribute("stroke-width", "1");
  svg.appendChild(axis);

  function tracarLinha(pts, color) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", "path");
    el.setAttribute("d", pathSuave(pts)); el.setAttribute("fill", "none");
    el.setAttribute("stroke", color); el.setAttribute("stroke-width", "2.5");
    el.setAttribute("stroke-linecap", "round"); el.setAttribute("stroke-linejoin", "round");
    svg.appendChild(el);
    pts.forEach((p) => {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", p[0]); c.setAttribute("cy", p[1]); c.setAttribute("r", 3);
      c.setAttribute("fill", color);
      svg.appendChild(c);
    });
  }
  const ptsForecast = dados.forecast.map((v, i) => [xFor(i), yFor(v)]);
  const ptsExpedido = dados.expedido.map((v, i) => [xFor(i), yFor(v)]);
  tracarLinha(ptsForecast, "#3A4F82");
  tracarLinha(ptsExpedido, "#6B7F3A");

  // Rótulos: forecast acima / expedido abaixo, com afastamento dinâmico
  // quando as duas séries ficam próximas naquele dia (evita sobreposição)
  const GAP_MIN = 24;
  ptsForecast.forEach((ptF, i) => {
    const ptE = ptsExpedido[i];
    const dist = Math.abs(ptF[1] - ptE[1]);
    let offF = 10, offE = 18;
    if (dist < GAP_MIN) { const extra = (GAP_MIN - dist) / 2 + 4; offF += extra; offE += extra; }
    labelComFundo(svg, ptF[0], ptF[1] - offF, dados.forecast[i].toLocaleString('pt-BR'), {fontSize:10, cor:"#3A4F82"});
    labelComFundo(svg, ptE[0], ptE[1] + offE, dados.expedido[i].toLocaleString('pt-BR'), {fontSize:10, cor:"#6B7F3A"});
  });

  dados.dias.forEach((lab, i) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", xFor(i)); t.setAttribute("y", h - 10);
    t.setAttribute("text-anchor", "middle"); t.setAttribute("font-size", "10");
    t.setAttribute("fill", "#6B7280");
    t.textContent = lab;
    svg.appendChild(t);
  });
}
